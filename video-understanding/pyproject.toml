[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-understanding-core"
version = "0.1.1"
description = "Scoped audiovisual analysis with a Chat Completions media backend"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4"]
license = "MIT"

[project.optional-dependencies]
links = ["yt-dlp==2026.8.19"]

[tool.setuptools.packages.find]
where = ["src"]
